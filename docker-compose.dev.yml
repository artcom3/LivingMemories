name: livingmemories-dev

x-runtime: &runtime
  image: ${COMPOSE_PROJECT_NAME:-livingmemories-dev}-worker:local
  build:
    context: .
    target: worker
  init: true
  env_file:
    - path: .env
      required: true
    - path: .env.local
      required: false
  environment: &runtime-env
    DOCKER_RUNTIME: "1"
    POSTGRES_USER: ${POSTGRES_USER:-livingmemories}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm docker:env first}
    POSTGRES_DB: ${POSTGRES_DB:-livingmemories}
    DOCKER_APP_URL: ${DOCKER_APP_URL:-http://localhost:8081}
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: ${S3_BUCKET:-livingmemories}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run pnpm docker:env first}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run pnpm docker:env first}
    S3_FORCE_PATH_STYLE: "true"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    WORKER_HEALTH_URL: http://worker:3010
    WORKER_HEALTH_PORT: "3010"

services:
  db:
    image: ${COMPOSE_PROJECT_NAME:-livingmemories-dev}-postgres:18-vector
    build:
      context: docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livingmemories}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-livingmemories}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: ${COMPOSE_PROJECT_NAME:-livingmemories-dev}-minio:local
    build:
      context: docker/minio
      target: server
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run pnpm docker:env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm docker:env first}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: ${COMPOSE_PROJECT_NAME:-livingmemories-dev}-minio-client:local
    build:
      context: docker/minio
      target: client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-livingmemories}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.2
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    <<: *runtime
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-3010}:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    <<: *runtime
    image: ${COMPOSE_PROJECT_NAME:-livingmemories-dev}-app:local
    build:
      context: .
      target: web
    environment:
      <<: *runtime-env
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  minio_data:
  mailpit_data:
